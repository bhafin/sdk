name: Verify SDK
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm --prefix tooling ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-generated.mjs
      - run: npm run build
      - run: npm test
      - run: node scripts/check-local-examples.mjs
      - run: node scripts/verify-package.mjs
